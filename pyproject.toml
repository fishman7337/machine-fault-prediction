[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-fault-classifier"
version = "0.1.0"
description = "A reproducible machine fault prediction workflow for predictive maintenance."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Goh Kun Ming" }
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
notebook = [
  "ipykernel>=6.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.0",
]
security = [
  "bandit[toml]>=1.7.10",
  "pip-audit>=2.7",
]

[project.scripts]
fault-predict = "fault_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks/**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = [".git", ".venv", "build", "dist", "notebooks", "tests"]
skips = []
